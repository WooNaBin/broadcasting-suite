<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>방송실 프로그램</title>
  <link rel="stylesheet" href="/css/hub.css" />
</head>
<body>
  <main class="shell">
    <header class="hero compact">
      <h1>방송실 프로그램</h1>
      <div class="status-row">
        <span id="badge" class="badge">확인 중…</span>
        <button type="button" id="btn-setup" class="ghost">NAS 설정</button>
      </div>
      <div id="nas-info" class="nas-info" hidden></div>
    </header>

    <section class="apps" aria-label="앱">
      <a class="app-card" data-app="/schedule/" href="/schedule/"><strong>스케줄</strong></a>
      <a class="app-card" data-app="/worklog/" href="/worklog/"><strong>작업일지</strong></a>
      <a class="app-card" data-app="/files/" href="/files/"><strong>파일체크</strong></a>
    </section>
  </main>
  <script src="/js/session.js"></script>
  <script src="/js/hub.js"></script>
</body>
</html>
